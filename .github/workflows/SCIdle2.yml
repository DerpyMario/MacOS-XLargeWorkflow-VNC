name: Backup macOS Screensavers and Aerial Assets

on:
  workflow_dispatch:
    inputs:
      include_system_assets:
        description: Include system screensaver resources
        type: boolean
        default: true
        required: true

jobs:
  backup:
    runs-on: xcode-27

    steps:
      - name: Install 7-Zip
        run: brew install sevenzip

      - name: Collect screensavers and aerial assets
        shell: bash
        env:
          INCLUDE_SYSTEM_ASSETS: ${{ inputs.include_system_assets }}
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/macos-screensavers"
          mkdir -p "$DEST"/{bundles,aerial,resources,metadata}

          # Define source directories
          SAVER_DIRS=()
          SAVER_LABELS=()
          AERIAL_DIRS=()
          AERIAL_LABELS=()

          if [[ "$INCLUDE_SYSTEM_ASSETS" == "true" ]]; then
            SAVER_DIRS+=(
              "/System/Library/Screen Savers"
              "/Library/Screen Savers"
            )
            SAVER_LABELS+=(system library)

            AERIAL_DIRS+=(
              "/Library/Application Support/com.apple.idleassetsd"
            )
            AERIAL_LABELS+=(system)
          fi

          SAVER_DIRS+=("$HOME/Library/Screen Savers")
          SAVER_LABELS+=(user)

          AERIAL_DIRS+=(
            "$HOME/Library/Application Support/com.apple.idleassetsd"
          )
          AERIAL_LABELS+=(user)

          # Collect complete screensaver bundles
          for i in "${!SAVER_DIRS[@]}"; do
            DIR="${SAVER_DIRS[$i]}"
            LABEL="${SAVER_LABELS[$i]}"

            [[ -d "$DIR" ]] || continue

            while IFS= read -r -d '' BUNDLE; do
              NAME="$(basename "$BUNDLE")"
              TARGET="$DEST/bundles/$LABEL/$NAME"

              mkdir -p "$(dirname "$TARGET")"

              if ! ditto "$BUNDLE" "$TARGET" 2>/dev/null; then
                echo "::warning::Could not copy $BUNDLE"
              fi
            done < <(
              find "$DIR" -type d -name '*.saver' -prune -print0 2>/dev/null || true
            )
          done

          # Collect aerial video assets
          for i in "${!AERIAL_DIRS[@]}"; do
            DIR="${AERIAL_DIRS[$i]}"
            LABEL="${AERIAL_LABELS[$i]}"

            [[ -d "$DIR" ]] || continue

            if ! ditto "$DIR" "$DEST/aerial/$LABEL-idleassetsd" 2>/dev/null; then
              echo "::warning::Could not copy aerial assets from $DIR"
            fi
          done

          # Collect additional media and resource files
          for i in "${!SAVER_DIRS[@]}"; do
            DIR="${SAVER_DIRS[$i]}"
            LABEL="${SAVER_LABELS[$i]}"

            [[ -d "$DIR" ]] || continue

            while IFS= read -r -d '' FILE; do
              RELATIVE="${FILE#"$DIR"/}"
              TARGET="$DEST/resources/$LABEL/$RELATIVE"

              mkdir -p "$(dirname "$TARGET")"

              if ! cp -p "$FILE" "$TARGET" 2>/dev/null; then
                echo "::warning::Could not copy $FILE"
              fi
            done < <(
              find "$DIR" -type f \( \
                -iname '*.mov' -o \
                -iname '*.mp4' -o \
                -iname '*.m4v' -o \
                -iname '*.heic' -o \
                -iname '*.jpg' -o \
                -iname '*.jpeg' -o \
                -iname '*.plist' \
              \) -print0 2>/dev/null || true
            )
          done

          # Collect screensaver preferences
          for PREF_DIR in \
            "$HOME/Library/Preferences" \
            "$HOME/Library/Preferences/ByHost"
          do
            [[ -d "$PREF_DIR" ]] || continue

            while IFS= read -r -d '' FILE; do
              cp -p "$FILE" "$DEST/metadata/" 2>/dev/null || true
            done < <(
              find "$PREF_DIR" -maxdepth 1 -type f \
                -iname '*screensaver*' -print0 2>/dev/null || true
            )
          done

          # Generate inventory, excluding the inventory itself
          find "$DEST" -type f ! -name inventory.txt -print |
            LC_ALL=C sort > "$DEST/metadata/inventory.txt"

          echo "Screensaver collection completed."
          echo "Collected files:"
          find "$DEST" -type f | wc -l
          du -sh "$DEST"
          find "$DEST" -maxdepth 3 -print

      - name: Create 7-Zip archive
        run: |
          7zz a -t7z -mx=7 \
            "$GITHUB_WORKSPACE/macos-screensavers.7z" \
            "$RUNNER_TEMP/macos-screensavers"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-screensavers-and-aerial-assets
          path: macos-screensavers.7z
          if-no-files-found: error
          retention-days: 14
